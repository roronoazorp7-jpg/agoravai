openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Connected Discord account
  - name: guilds
    description: Guild configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getDiscordIdentity
      tags: [account]
      summary: Get the connected Discord identity
      responses:
        "200":
          description: Connected Discord user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordIdentity"
        "401":
          description: Discord connection is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guilds:
    get:
      operationId: listGuilds
      tags: [guilds]
      summary: List configured guilds where the connected Discord user is an administrator
      responses:
        "200":
          description: Admin-accessible guilds with bot configuration summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuildSummary"
        "401":
          description: Discord connection is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guilds/{guildId}/channels:
    get:
      operationId: listGuildChannels
      tags: [guilds]
      summary: List text channels available to the bot
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Discord channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuildChannel"
        "403":
          description: User is not an administrator of this guild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guilds/{guildId}/config:
    get:
      operationId: getGuildConfig
      tags: [guilds]
      summary: Get full guild configuration
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guild config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildConfig"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateGuildConfig
      tags: [guilds]
      summary: Update guild configuration
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuildConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildConfig"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guilds/{guildId}/panels/ticket/send:
    post:
      operationId: sendTicketPanel
      tags: [guilds]
      summary: Send ticket panel to Discord channel
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Panel sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelActionResult"
        "400":
          description: No channel configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guilds/{guildId}/panels/ticket/update:
    post:
      operationId: updateTicketPanel
      tags: [guilds]
      summary: Edit existing ticket panel message in Discord
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Panel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelActionResult"
        "409":
          description: No panel ID saved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found in Discord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guilds/{guildId}/stats:
    get:
      operationId: getGuildStats
      tags: [guilds]
      summary: Get guild statistics
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guild stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildStats"
