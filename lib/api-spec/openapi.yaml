        welcomeEnabled:
          type: boolean
        partnerEnabled:
          type: boolean
        hasTicketChannel:
          type: boolean
        hasShop:
          type: boolean
        isOwner:
          type: boolean
        permissions:
          type: integer
        memberCount:
          type: ["integer", "null"]
        discordName:
          type: ["string", "null"]
        discordIcon:
          type: ["string", "null"]
      required:
        - id
        - guildId
        - welcomeEnabled
        - partnerEnabled
        - hasTicketChannel
        - hasShop
        - isOwner
        - permissions
    DiscordIdentity:
